<style>
  :root { --paper:#f3ebda; --ink:#2a2622; --blue:#2f5f8f; --terra:#b9532f; --acc:#d1432f; }
  html, body { margin:0; height:100%; background:#1b1a18; overflow:hidden; }
  #stage { position:absolute; left:50%; top:50%; width:1440px; height:900px; transform-origin:center center;
           transform:translate(-50%,-50%); font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; color:var(--ink); background:var(--paper); overflow:hidden; }
  #stage canvas { position:absolute; left:0; top:0; width:1440px !important; height:900px !important; }
  u { text-decoration:underline; text-decoration-thickness:3px; text-underline-offset:5px; text-decoration-color:var(--acc); font-weight:700; }
  .dark u { text-decoration-color:#ffd36b; }

  /* ---------- map nodes ---------- */
  .node { position:absolute; border:0; background:transparent; cursor:pointer; color:var(--ink); font-family:inherit;
          border-radius:18px; padding:0; transition:transform .18s, box-shadow .18s, background .18s; text-align:left; }
  .node:hover, .node:focus-visible { transform:scale(1.045); outline:none; background:rgba(255,255,255,.22);
          box-shadow:0 0 0 5px #e3a72f, 0 12px 26px rgba(0,0,0,.28); z-index:3; }
  .node::after { content:"▶"; position:absolute; right:-9px; top:-11px; width:30px; height:30px; border-radius:50%;
          background:#e3a72f; color:#2a2622; font-size:13px; display:grid; place-items:center; box-shadow:0 2px 6px rgba(0,0,0,.35);
          animation:ping 2.4s infinite; }
  @keyframes ping { 0%,100% { transform:scale(1);} 50% { transform:scale(1.18);} }
  .leaf { display:flex; flex-direction:column; justify-content:center; }
  .leaf .t1 { font:700 29px/1.1 Georgia,"Times New Roman",serif; }
  .leaf .t2 { font-size:23px; margin-top:5px; line-height:1.15; }
  .hub, .root { color:#fff6e4; text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  .hub .lab { font-size:19px; letter-spacing:.28em; font-weight:700; color:#ffd36b; }
  .hub .tt { font:700 31px/1.15 Georgia,serif; margin-top:3px; }
  .root .tt { font:700 52px/1 Georgia,serif; }
  .root .st { font-size:23px; margin-top:8px; opacity:.95; }

  /* ---------- panel ---------- */
  #panel { position:absolute; inset:0; background:rgba(30,26,22,.62); display:none; z-index:20; }
  #panel.open { display:block; }
  #card { position:absolute; left:44px; right:44px; top:22px; bottom:22px; background:#f9f3e4; border-radius:24px; border:5px solid var(--c);
          box-shadow:0 20px 60px rgba(0,0,0,.55); display:flex; flex-direction:column; overflow:hidden; }
  #head { display:flex; align-items:center; gap:24px; padding:14px 28px; background:var(--c); color:#fff6e4; flex:none; }
  #head img { height:104px; border-radius:14px; background:#f3ebda; border:3px solid rgba(255,255,255,.7); }
  #head .ttl { font:700 42px/1.1 Georgia,serif; }
  #head .sub { font-size:24px; margin-top:4px; opacity:.95; }
  #head .ttl u, #head .sub u { text-decoration-color:#ffd36b; }
  #close { margin-left:auto; font-size:26px; font-weight:700; font-family:inherit; border:3px solid #fff6e4; background:transparent; color:#fff6e4; border-radius:14px; padding:10px 20px; cursor:pointer; }
  #close:hover { background:#fff6e4; color:var(--c); }

  #body h3 { font:700 34px Georgia,serif; color:var(--c); margin:30px 0 10px; }

  #body p { margin:8px 0; }
  .pts { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; margin:12px 0; }
  .pt { background:#fff; border:3px solid var(--c); border-radius:16px; padding:12px 16px; font-size:24px; line-height:1.3; }
  .pt b { display:block; font:700 27px Georgia,serif; color:var(--c); }
  .btn { font-family:inherit; font-size:24px; padding:10px 18px; border-radius:14px; border:3px solid var(--c); background:#fff; color:var(--ink); cursor:pointer; margin:4px 6px 4px 0; transition:transform .12s, background .15s; }
  .btn:hover { transform:translateY(-2px); background:#fdf1cf; }
  .btn.on { background:var(--c); color:#fff6e4; }
  .btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }

  .code .k { color:#ffb86b; font-weight:700; }
  .code .s { color:#9fe0a2; }

  table.db td { border:2px solid #d9cdb4; padding:5px 12px; }
  table.db tr.hl td { background:#ffe69a; font-weight:700; }
  table.db tr.hl2 td { background:#cfe8d3; }
  table.db td.null { color:#aaa; font-style:italic; background:#f1ece0; }
  table.db tr.rw { cursor:pointer; }
  table.db tr.rw:hover td { background:#fff2c6; }
  .badge { font-size:14px; background:#e3a72f; color:#2a2622; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:2px; }
  .row2 { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; }
  .fb { min-height:36px; margin:8px 0; font-weight:700; }
  .ok { color:#2b7a3d; } .bad { color:#b3261e; }
  .qcard { font:700 30px/1.25 Georgia,serif; background:#fff; border:3px solid var(--c); border-radius:16px; padding:16px 20px; margin:10px 0; }
  .qn { font-size:21px; color:#6b6358; }
  .chips { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:10px 0; }
  .chipn { border:4px solid #bbb; border-radius:18px; padding:8px 18px; font-size:26px; font-weight:700; background:#fff; transition:all .25s; }
  .chipn.on { background:#ffe69a; border-color:#e3a72f; transform:scale(1.1); }
  .arrow { font-size:22px; color:#6b6358; text-align:center; }
  .shake { animation:shake .35s; }
  @keyframes shake { 0%,100% { transform:translateX(0);} 25% { transform:translateX(-8px);} 75% { transform:translateX(8px);} }

  .flip b { font:700 28px Georgia,serif; color:var(--c); display:block; }
  .flip.open { background:#ffe69a; }
  .flip .def { display:none; }
  .flip.open .def { display:block; }
  .flip .hint { color:#7a7164; font-size:21px; }
  .flip.open .hint { display:none; }
  .bal { font:700 34px Georgia,serif; background:#fff; border:3px solid var(--c); border-radius:16px; padding:12px 22px; min-width:220px; text-align:center; }
  .bal small { display:block; font:400 21px "Trebuchet MS"; color:#6b6358; }
  .log { font-family:Consolas,monospace; font-size:22px; background:#2b2a33; color:#f5e9c8; border-radius:12px; padding:10px 14px; min-height:150px; margin-top:10px; }
  .log div.err { color:#ff8f86; } .log div.good { color:#9fe0a2; }
  .gnode { border:4px solid var(--c); background:#fff; border-radius:50px; padding:8px 20px; font:700 26px Georgia,serif; transition:all .25s; }
  .gnode.on { background:#ffe69a; border-color:#e3a72f; transform:scale(1.12); }
  .gedge { font-size:20px; color:#6b6358; text-align:center; font-weight:700; }
  .gedge.on { color:var(--acc); }
  .compare { width:100%; border-collapse:collapse; font-size:24px; background:#fff; }
  .compare th { background:var(--c); color:#fff6e4; padding:10px 14px; text-align:left; }
  .compare td { border:2px solid #d9cdb4; padding:9px 14px; }
  .compare td:first-child { font-weight:700; background:#f4ecd8; }
  .link { background:none; border:0; font:inherit; font-weight:700; color:var(--c); text-decoration:underline; cursor:pointer; padding:0; }
  .chipimg { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .chipimg img { height:62px; border-radius:10px; background:#f3ebda; }

<script>
/* =====================================================================
   "Cartografía de tinta y acuarela" — Mapa mental interactivo, Temas 3 y 4
   Movimiento: cuaderno de apuntes ilustrado (Sketchnote) / acuarela botánica.
   Filosofía: una idea es un territorio. Cada concepto se pinta como una mancha
   de acuarela superpuesta (glaze) y se conecta con trazos de tinta; el color
   organiza el territorio (azul de Prusia = Tema 3, bases de datos; terracota =
   Tema 4, sistemas de información; ocre = acento interactivo). Las ilustraciones
   —cilindros de datos, tablas, grafos, monitores, personas— se pintan con p5.brush
   (washes, lápiz 2B, rotring) y los términos que viven en inglés se subrayan.
   El código coloca; el pincel pinta. Todo es determinista (semilla fija).
   ===================================================================== */
const W = 1440, H = 900;
const C = { paper:'#f3ebda', ink:'#2a2622', blue:'#2f5f8f', blueM:'#6d9bc4', blueL:'#c3d7e8', terra:'#b9532f', terraM:'#e29a6f', terraL:'#f4d3b8', ochre:'#e3a72f', cream:'#fff6e4', green:'#5f8a6e' };

/* ---------- geometry of the map (shared by paint + DOM) ---------- */
const NODES = [
  { id:'root', kind:'root', x:720, y:449, w:460, h:150, tt:'Temas 3 y 4', st:'Datos y sistemas de información' },
  { id:'t3', kind:'hub', br:'A', x:720, y:261, w:1000, h:106, lab:'TEMA 3', tt:'Bases de datos: <u>Relational</u> vs <u>Non-Relational</u>' },
  { id:'t4', kind:'hub', br:'B', x:720, y:637, w:1000, h:106, lab:'TEMA 4', tt:'Componentes de los <u>Information Systems</u>' },
  { id:'rel',   kind:'leaf', br:'A', x:250,  y:89, w:440, h:118, t1:'Modelo relacional', t2:'<u>Relational</u> · <u>SQL</u>' },
  { id:'nosql', kind:'leaf', br:'A', x:720,  y:89, w:440, h:118, t1:'Modelo no relacional', t2:'<u>Non-Relational</u> · <u>NoSQL</u>' },
  { id:'cmp',   kind:'leaf', br:'A', x:1190, y:89, w:440, h:118, t1:'Comparación', t2:'¿Cuál elegir y cuándo?' },
  { id:'hw',    kind:'leaf', br:'B', x:152,  y:809, w:266, h:118, t1:'<u>Hardware</u>', t2:'Equipo físico' },
  { id:'sw',    kind:'leaf', br:'B', x:436,  y:809, w:266, h:118, t1:'<u>Software</u>', t2:'Programas' },
  { id:'data',  kind:'leaf', br:'B', x:720,  y:809, w:266, h:118, t1:'Datos', t2:'(<u>Data</u>)' },
  { id:'people',kind:'leaf', br:'B', x:1004, y:809, w:266, h:118, t1:'Personas', t2:'(<u>People</u>)' },
  { id:'proc',  kind:'leaf', br:'B', x:1288, y:809, w:266, h:118, t1:'Procesos', t2:'(<u>Processes</u>)' },
];
const NB = Object.fromEntries(NODES.map(n => [n.id, n]));
const icSize = n => n.br === 'A' ? 84 : 66;
const icCenter = n => [n.x - n.w/2 + 16 + icSize(n)/2, n.y];
const CROPS = {};   // id -> dataURL of painted image (cropped from the canvas)

/* ---------- build DOM for the map ---------- */
const stage = document.getElementById('stage');
(function buildMap() {
  let html = '';
  for (const n of NODES) {
    const st = `left:${n.x-n.w/2}px;top:${n.y-n.h/2}px;width:${n.w}px;height:${n.h}px;`;
    if (n.kind === 'root') html += `<button class="node root dark" data-open="root-info" style="${st}" aria-label="Temas 3 y 4"><span class="tt">${n.tt}</span><span class="st">${n.st}</span></button>`;
    else if (n.kind === 'hub') html += `<button class="node hub dark" data-open="${n.id}" style="${st}"><span class="lab">${n.lab}</span><span class="tt">${n.tt}</span></button>`;
    else html += `<button class="node leaf ${n.br}" data-open="${n.id}" style="${st}padding-left:${icSize(n)+30}px;"><span class="t1">${n.t1}</span><span class="t2">${n.t2}</span></button>`;
  }
  stage.insertAdjacentHTML('afterbegin', html);
})();

function fitStage() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener('resize', fitStage); fitStage();

/* =====================================================================
   PAINTING
   ===================================================================== */
const rp = (x, y, w, h) => [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
function rr(x, y, w, h, r = 18) {                   // rounded-rect polygon, x,y = top-left
  const p = [];
  const corner = (cx, cy, a0) => { for (let i = 0; i <= 5; i++) { const a = a0 + i * 18; p.push([cx + r * cos(a), cy + r * sin(a)]); } };
  corner(x + w - r, y + r, -90); corner(x + w - r, y + h - r, 0); corner(x + r, y + h - r, 90); corner(x + r, y + r, 180);
  return p;
}
function ep(cx, cy, rx, ry, n = 26, a0 = 0, a1 = 360) {
  const p = [];
  for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); p.push([cx + rx * cos(a), cy + ry * sin(a)]); }
  return p;
}
function glaze(points, color, opacity = 100, layers = 3, jitter = 3) {
  brush.noStroke();
  for (let i = 0; i < layers; i++) {
    brush.wash(color, opacity);
    brush.polygon(points.map(([x, y]) => [x + random(-jitter, jitter), y + random(-jitter, jitter)]));
  }
  brush.noWash();
}
function pl(points, col, w = 0.8, name = '2B', closed = false) {   // pencil polyline
  brush.noFill(); brush.set(name, col, w);
  const n = points.length;
  for (let i = 0; i < n - (closed ? 0 : 1); i++) {
    const a = points[i], b = points[(i + 1) % n];
    brush.line(a[0], a[1], b[0], b[1]);
  }
}
function watercolor(points, col, op = 200, bleed = 0.22, tex = 0.6) {

const jit = (pts, j) => pts.map(([x, y]) => [x + random(-j, j), y + random(-j, j)]);

/* ----- icons ----- */
function iCyl(cx, cy, s, col, light) {
  const rx = s * .34, ry = s * .115, top = cy - s * .3, bot = cy + s * .3;
  glaze([[cx-rx, top], ...ep(cx, bot, rx, ry, 14, 180, 0), [cx+rx, top]], col, 120, 3, 1.5);
  glaze(ep(cx, top, rx, ry, 20), light, 150, 2, 1);
  pl(ep(cx, top, rx, ry, 20), C.ink, .7, '2B', true);
  pl([[cx-rx, top], [cx-rx, bot]], C.ink, .8); pl([[cx+rx, top], [cx+rx, bot]], C.ink, .8);
  pl(ep(cx, bot, rx, ry, 14, 0, 180), C.ink, .8);

}
function brace(cx, cy, s, dir, col) {
  const d = dir;

  brush.spline([[cx + d*s*.1, cy - s*.34], [cx - d*s*.04, cy - s*.26], [cx - d*s*.04, cy - s*.07], [cx - d*s*.2, cy], [cx - d*s*.04, cy + s*.07], [cx - d*s*.04, cy + s*.26], [cx + d*s*.1, cy + s*.34]], .7);
}
function iNoSql(cx, cy, s, col, light) {
  brace(cx - s*.3, cy, s, 1, C.ink); brace(cx + s*.3, cy, s, -1, C.ink);
  const nodes = [[cx - s*.12, cy - s*.14], [cx + s*.13, cy - s*.1], [cx, cy + s*.15]];
  for (const [a, b] of [[0,1],[1,2],[2,0]]) pl([nodes[a], nodes[b]], C.ink, .6);
  nodes.forEach(([x, y], i) => { glaze(ep(x, y, s*.085, s*.085, 14), [col, light, C.terraM][i], 170, 2, 1); pl(ep(x, y, s*.085, s*.085, 14), C.ink, .5, '2B', true); });
}
function iScale(cx, cy, s, col) {
  pl([[cx, cy - s*.34], [cx, cy + s*.3]], C.ink, 1); pl([[cx - s*.2, cy + s*.32], [cx + s*.2, cy + s*.32]], C.ink, 1);
  pl([[cx - s*.36, cy - s*.2], [cx + s*.36, cy - s*.26]], C.ink, 1);
  for (const [px, py, c] of [[cx - s*.36, cy - s*.2, C.blueM], [cx + s*.36, cy - s*.26, C.terraM]]) {
    pl([[px, py], [px - s*.14, py + s*.3]], C.ink, .5); pl([[px, py], [px + s*.14, py + s*.3]], C.ink, .5);
    const pan = [...ep(px, py + s*.3, s*.16, s*.08, 10, 0, 180)];
    glaze(pan, c, 190, 2, 1); pl(pan, C.ink, .8, '2B', true);

}
function iChip(cx, cy, s, col, light) {
  const q = s * .26;
  for (let i = -2; i <= 2; i += 1) {
    const o = i * q * .42;
    pl([[cx + o, cy - q - s*.1], [cx + o, cy - q]], C.ink, .8); pl([[cx + o, cy + q], [cx + o, cy + q + s*.1]], C.ink, .8);
    pl([[cx - q - s*.1, cy + o], [cx - q, cy + o]], C.ink, .8); pl([[cx + q, cy + o], [cx + q + s*.1, cy + o]], C.ink, .8);
  }
  glaze(rr(cx - q, cy - q, q*2, q*2, 6), col, 150, 3, 1.5); pl(rr(cx - q, cy - q, q*2, q*2, 6), C.ink, .9, '2B', true);
  glaze(rr(cx - q*.5, cy - q*.5, q, q, 3), light, 200, 2, 1); pl(rr(cx - q*.5, cy - q*.5, q, q, 3), C.ink, .6, '2B', true);
}
function iWindow(cx, cy, s, col, light) {
  const x = cx - s*.4, y = cy - s*.32, w = s*.8, h = s*.64;
  glaze(rr(x, y, w, h, 7), light, 170, 3, 1.5); glaze(rp(x + 2, y + 2, w - 4, s*.15), col, 190, 2, 1);
  pl(rr(x, y, w, h, 7), C.ink, .9, '2B', true); pl([[x, y + s*.16], [x + w, y + s*.16]], C.ink, .7);
  [0, 1, 2].forEach(i => { glaze(ep(x + s*.1 + i*s*.09, y + s*.08, s*.025, s*.025, 8), [C.terraM, C.ochre, C.green][i], 220, 1, 0); });
  pl([[cx - s*.1, cy - s*.02], [cx - s*.2, cy + s*.1], [cx - s*.1, cy + s*.2]], C.ink, 1.1);
  pl([[cx + s*.1, cy - s*.02], [cx + s*.2, cy + s*.1], [cx + s*.1, cy + s*.2]], C.ink, 1.1);

function iBars(cx, cy, s, col, light) {

  hs.forEach((hh, i) => {
    const x = cx - s*.34 + i * s*.18, hgt = hh * s;
    glaze(rp(x, cy + s*.3 - hgt, s*.13, hgt), [light, col, C.terraM, col][i], 170, 3, 1.3);
    pl(rp(x, cy + s*.3 - hgt, s*.13, hgt), C.ink, .7, '2B', true);

  [[.2, -.3], [.3, -.38], [.1, -.4]].forEach(([dx, dy]) => glaze(ep(cx + dx*s - s*.05, cy + dy*s, s*.025, s*.025, 8), C.ochre, 230, 2, .5));
}
function iPerson(cx, cy, s, col, light, ink = C.ink) {
  const hy = cy - s*.16;
  glaze(ep(cx, hy, s*.15, s*.15, 18), light, 220, 2, 1); pl(ep(cx, hy, s*.15, s*.15, 18), ink, .8, '2B', true);
  const sh = ep(cx, cy + s*.4, s*.3, s*.3, 18, 180, 360);

function iPeople(cx, cy, s, col, light) {

  iPerson(cx + s*.2, cy + s*.04, s*.78, C.blueM, C.blueL);

function iCycle(cx, cy, s, col) {
  const r = s * .3;
  for (const [a0, a1, c] of [[200, 335, C.terra], [20, 155, C.ochre]]) {
    const pts = ep(cx, cy, r, r, 12, a0, a1);
    glaze([...ep(cx, cy, r + 5, r + 5, 12, a0, a1), ...ep(cx, cy, r - 5, r - 5, 12, a1, a0)], c, 170, 2, .8);
    pl(pts, C.ink, .9);

/* ----- passes ----- */
const ICONS = { rel: iCyl, nosql: iNoSql, cmp: iScale, hw: iChip, sw: iWindow, data: iBars, people: iPeople, proc: iCycle };
let paperShader;
const PAPER_FRAG = `
precision highp float;
varying vec2 vTexCoord;
uniform sampler2D tex0;
uniform vec2 canvasSize;
uniform float seed;
uniform float tooth;
uniform float granulation;
float hash(vec2 p) { vec3 p3 = fract(vec3(p.xyx + seed) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y); }
float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * vnoise(p); p *= 2.03; a *= 0.5; } return v; }
void main() {
  vec2 px = vTexCoord * canvasSize;
  vec4 col = texture2D(tex0, vTexCoord);
  float fine = vnoise(px * 0.9);
  float coarse = fbm(px * 0.035);
  float fibre = smoothstep(0.82, 1.0, vnoise(vec2(px.x * 0.02, px.y * 0.6)));
  float pigment = 1.0 - dot(col.rgb, vec3(0.299, 0.587, 0.114));
  float shade = tooth * ((fine - 0.5) * 0.10 + (coarse - 0.5) * 0.08) + granulation * pigment * (fine - 0.35) * 0.22 - fibre * 0.025;
  gl_FragColor = vec4(clamp(col.rgb - shade, 0.0, 1.0), col.a);
}`;

const PASSES = [
  function ground() {
    // pale territory washes: blue north, terracotta south, warm centre
    watercolor(jit([[-20, -20], [W + 20, -20], [W + 20, 400], [900, 430], [520, 390], [-20, 420]], 14), '#d3e2ee', 150, .35, .5);
    watercolor(jit([[-20, 480], [520, 505], [900, 470], [W + 20, 500], [W + 20, H + 20], [-20, H + 20]], 14), '#f6dcc4', 150, .35, .5);
    watercolor(jit([[-20, 395], [W + 20, 395], [W + 20, 505], [-20, 505]], 8), '#f1e6c9', 110, .3, .4);
    // pigment dabs in the margins
    brush.noStroke();
    for (let i = 0; i < 46; i++) {
      const top = random() < .5, x = random(W), y = top ? random(0, 440) : random(460, H);
      const r = random(5, 20), col = top ? random([C.blueM, C.blueL, C.blue]) : random([C.terraM, C.terraL, C.ochre]);
      glaze(ep(x, y, r, r * random(.7, 1.1), 12), col, 55, 2, 2);
    }
  },
  function connectors() {
    brush.field('hand');
    const links = [['root','t3','A'], ['root','t4','B'], ['t3','rel','A'], ['t3','nosql','A'], ['t3','cmp','A'],
                   ['t4','hw','B'], ['t4','sw','B'], ['t4','data','B'], ['t4','people','B'], ['t4','proc','B']];
    for (const [a, b, br] of links) {
      const A = NB[a], B = NB[b], col = br === 'A' ? C.blue : C.terra;
      const up = B.y < A.y;
      const left = A.x - A.w/2 + 50, right = A.x + A.w/2 - 50;
      const x1 = a === 'root' ? A.x : Math.max(left, Math.min(right, B.x));
      const y1 = A.y + (up ? -A.h/2 : A.h/2), x2 = B.x, y2 = B.y + (up ? B.h/2 : -B.h/2);
      const dy = y2 - y1;
      for (const [name, c, wgt] of [['marker', col, 1.5], ['2B', C.ink, .9]])
        { brush.set(name, c, wgt); brush.spline([[x1, y1], [x1, y1 + dy * .35], [x2, y2 - dy * .35], [x2, y2]], 1); }
    }
    brush.noField();
  },
  function hubs() {
    // root: deep indigo ink wash, two glazes
    const R = NB.root, A = NB.t3, B = NB.t4;

    glaze(jit(body(R), 2), '#222b4a', 240, 2, 2); glaze(jit(body(A), 2), '#235283', 240, 2, 2); glaze(jit(body(B), 2), '#a34a29', 240, 2, 2);
    watercolor(jit(body(R), 3), '#3a4670', 160, .06, .6); watercolor(jit(body(A), 3), C.blue, 150, .06, .6); watercolor(jit(body(B), 3), '#cf6a42', 150, .06, .6);
    brush.field('hand');
    for (const n of [R, A, B]) { pl(rr(n.x - n.w/2 - 4, n.y - n.h/2 - 4, n.w + 8, n.h + 8, 28), n === B ? '#7a3317' : '#1c2540', .9, '2B', true); }
    brush.noField();
  },
  function leavesA() {
    for (const n of NODES.filter(n => n.kind === 'leaf' && n.br === 'A')) {
      glaze(rr(n.x - n.w/2, n.y - n.h/2, n.w, n.h, 18), C.blueL, 150, 3, 3);
      glaze(rr(n.x - n.w/2 + 4, n.y - n.h/2 + 4, 100, n.h - 8, 14), C.blueM, 45, 2, 2);
      brush.field('hand');
      pl(rr(n.x - n.w/2, n.y - n.h/2, n.w, n.h, 18), C.blue, 1.0, '2B', true);
      pl(rr(n.x - n.w/2 + 2, n.y - n.h/2 + 2, n.w, n.h, 18), C.ink, .45, 'HB', true);
      brush.noField();
    }
  },
  function leavesB() {
    for (const n of NODES.filter(n => n.kind === 'leaf' && n.br === 'B')) {

  function iconsA() {

function quiz(root, items, options, intro) {
  let i = 0, score = 0, done = false;
  root.innerHTML = `<div class="lab-box"><div style="font-weight:700;margin-bottom:4px">${intro}</div>
    <div class="qn"></div><div class="qcard"></div><div class="qo"></div><div class="fb"></div>
    <button class="btn nx" style="display:none">Siguiente ▶</button></div>`;
  const qn = $('.qn', root), qc = $('.qcard', root), qo = $('.qo', root), fb = $('.fb', root), nx = $('.nx', root);
  function show() {
    done = false; nx.style.display = 'none'; fb.innerHTML = '';
    if (i >= items.length) {
      qn.textContent = ''; qc.innerHTML = `🎉 Resultado: ${score} de ${items.length}`;
      qo.innerHTML = `<button class="btn rs">↻ Intentar de nuevo</button>`;
      $('.rs', root).onclick = () => { i = 0; score = 0; show(); }; return;
    }
    qn.textContent = `Pregunta ${i + 1} de ${items.length} · Aciertos: ${score}`;
    qc.innerHTML = items[i].t;
    qo.innerHTML = options.map((o, k) => `<button class="btn" data-k="${k}">${o}</button>`).join('');
    qo.querySelectorAll('.btn').forEach(b => b.onclick = () => {
      if (done) return; done = true;
      const k = +b.dataset.k, right = k === items[i].a;
      if (right) score++;
      b.classList.add('on');
      fb.innerHTML = right ? `<span class="ok">✔ ¡Correcto!</span> ${items[i].why}` : `<span class="bad">✘ Casi.</span> Era: <b>${options[items[i].a]}</b>. ${items[i].why}`;
      if (!right) b.classList.add('shake');
      nx.style.display = 'inline-block'; nx.textContent = i === items.length - 1 ? 'Ver resultado ▶' : 'Siguiente ▶';
    });
  }
  nx.onclick = () => { i++; show(); };
  show();
}

        vs.innerHTML = `<div class="row2"><div class="code" style="flex:1">{\n  "_id": 1,\n  "nombre": "Ana",\n  "ciudad": "Madrid"\n}</div><div class="code" style="flex:1">{\n  "_id": 2,\n  "nombre": "Luis",\n  "hobbies": ["fútbol","cine"],\n  "premium": true\n}</div></div>`;
        vsn.innerHTML = '🧩 Cada <u>document</u> guarda solo lo que necesita: <u>Schema</u> flexible.';
      }
    };
    draw('r');
    toggleCls([...r.querySelectorAll('[data-m]')], b => draw(b.dataset.m));
  } },

'rel': { color: C.blue, title: 'Modelo relacional · <u>Relational Database</u>', sub: 'Tablas, llaves y <u>SQL</u>',
  html: sec('¿Qué es?', `<p>Una <u>Relational Database</u> organiza los datos en <u>tables</u> formadas por filas (<u>rows</u>) y columnas (<u>columns</u>). Las tablas se relacionan mediante llaves y se consultan con <u>SQL</u>.</p>
    ${pts([['<u>Primary Key</u>', 'Identifica de forma única cada fila (ej. <code>id</code>).'], ['<u>Foreign Key</u>', 'Apunta a la llave primaria de otra tabla y crea la relación.'], ['<u>Schema</u> fijo', 'Se definen columnas y tipos antes de guardar datos.'], ['<u>JOIN</u>', 'Une tablas relacionadas en una sola consulta.']])}
    <p><b>Ejemplos:</b> MySQL, PostgreSQL, Oracle Database, SQL Server.</p>`)
  + sec('Laboratorio <u>SQL</u>', `<p>Pasa el cursor sobre un pedido para ver a qué cliente apunta su <u>Foreign Key</u>. Luego ejecuta una consulta:</p>
    <div class="row2"><div><b>Clientes</b> <span class="badge">PK = id</span><div id="tc"></div></div><div><b>Pedidos</b> <span class="badge">FK = cliente_id</span><div id="tp"></div></div></div>
    <div id="qb"></div><div class="code" id="sqlt">-- elige una consulta ▲</div><div id="res"></div>`, 'INTERACTIVO')
  + sec('Transacciones <u>ACID</u>', `<p>Toca cada tarjeta y luego prueba una transferencia bancaria de $100 de Ana a Luis:</p>
    <div class="pts" id="acid"></div>
    <div class="row2"><div class="bal" id="bA"><small>Ana</small>$<span>500</span></div><div style="font-size:42px;align-self:center">→</div><div class="bal" id="bL"><small>Luis</small>$<span>200</span></div></div>
    <p><button class="btn" id="tOk">✔ Transferir (COMMIT)</button><button class="btn" id="tBad">⚡ Transferir con fallo (ROLLBACK)</button></p>
    <div class="log" id="tlog">Esperando transacción…</div>`, 'INTERACTIVO'),
  init(r) {
    const tc = $('#tc', r), tp = $('#tp', r), res = $('#res', r), sqlt = $('#sqlt', r);
    const drawT = (hlC = [], hlP = [], hover = null) => {
      tc.innerHTML = tbl(['id', 'nombre', 'ciudad'], CL, '', row => `data-id="${row[0]}" class="${hlC.includes(row[0]) ? 'hl' : hover === row[0] ? 'hl2' : ''}"`);
      tp.innerHTML = tbl(['id', 'cliente_id', 'producto', 'total'], PE, '', row => `data-id="${row[0]}" data-c="${row[1]}" class="rw ${hlP.includes(row[0]) ? 'hl' : ''}"`);
      tp.querySelectorAll('tr.rw').forEach(tr => {
        tr.onmouseenter = () => { tc.querySelectorAll('tr[data-id]').forEach(t => t.classList.toggle('hl2', t.dataset.id === tr.dataset.c)); };
        tr.onmouseleave = () => tc.querySelectorAll('tr[data-id]').forEach(t => t.classList.remove('hl2'));
      });
    };
    drawT();
    const joined = PE.map(p => { const c = CL.find(c => c[0] === p[1]); return [c[1], p[2], '$' + p[3]]; });
    const sums = CL.map(c => [c[1], '$' + PE.filter(p => p[1] === c[0]).reduce((a, p) => a + p[3], 0)]);
    const Q = [
      { b: 'WHERE ciudad', sql: `<span class="k">SELECT</span> * <span class="k">FROM</span> Clientes\n<span class="k">WHERE</span> ciudad = <span class="s">'Madrid'</span>;`, hc: [1, 3], hp: [], out: () => tbl(['id', 'nombre', 'ciudad'], CL.filter(c => c[2] === 'Madrid')) },
      { b: 'WHERE total', sql: `<span class="k">SELECT</span> * <span class="k">FROM</span> Pedidos\n<span class="k">WHERE</span> total > 100;`, hc: [], hp: [101, 104], out: () => tbl(['id', 'cliente_id', 'producto', 'total'], PE.filter(p => p[3] > 100)) },
      { b: 'JOIN', sql: `<span class="k">SELECT</span> nombre, producto, total\n<span class="k">FROM</span> Clientes <span class="k">JOIN</span> Pedidos\n  <span class="k">ON</span> Clientes.id = Pedidos.cliente_id;`, hc: [1, 2, 3, 4], hp: [101, 102, 103, 104, 105], out: () => tbl(['nombre', 'producto', 'total'], joined) },
      { b: 'GROUP BY', sql: `<span class="k">SELECT</span> nombre, <span class="k">SUM</span>(total) <span class="k">AS</span> gasto\n<span class="k">FROM</span> Clientes <span class="k">JOIN</span> Pedidos <span class="k">ON</span> Clientes.id = Pedidos.cliente_id\n<span class="k">GROUP BY</span> nombre;`, hc: [1, 2, 3, 4], hp: [101, 102, 103, 104, 105], out: () => tbl(['nombre', 'gasto'], sums) },
    ];
    $('#qb', r).innerHTML = Q.map((q, i) => `<button class="btn" data-i="${i}">▶ ${q.b}</button>`).join('');
    toggleCls([...r.querySelectorAll('#qb .btn')], b => {
      const q = Q[+b.dataset.i]; drawT(q.hc, q.hp); sqlt.innerHTML = q.sql; res.innerHTML = `<b>Resultado:</b>` + q.out();
    });
    // flip cards
    const A = [['A · <u>Atomicity</u>', 'Atomicidad', 'Todo o nada: la transacción se completa entera o no ocurre.'], ['C · <u>Consistency</u>', 'Consistencia', 'Los datos siempre cumplen las reglas definidas.'], ['I · <u>Isolation</u>', 'Aislamiento', 'Transacciones simultáneas no se estorban entre sí.'], ['D · <u>Durability</u>', 'Durabilidad', 'Lo confirmado (<u>commit</u>) no se pierde, aunque falle la luz.']];
    const ac = $('#acid', r);
    ac.innerHTML = A.map(a => `<div class="flip"><b>${a[0]}</b><span class="hint">Toca para ver ▸</span><span class="def"><i>${a[1]}</i>: ${a[2]}</span></div>`).join('');
    ac.querySelectorAll('.flip').forEach(f => f.onclick = () => f.classList.toggle('open'));
    // transfer
    let ana = 500, luis = 200, busy = false;
    const log = $('#tlog', r), bA = $('#bA span', r), bL = $('#bL span', r);
    const upd = () => { bA.textContent = ana; bL.textContent = luis; };
    function run(fail) {
      if (busy) return; busy = true; log.innerHTML = '';
      const add = (t, c = '') => log.insertAdjacentHTML('beforeend', `<div class="${c}">${t}</div>`);
      const steps = [
        () => add('BEGIN;'), () => { ana -= 100; upd(); add('UPDATE cuentas SET saldo = saldo - 100 WHERE nombre = \'Ana\';'); },
        () => fail ? (add('⚡ ¡Falla de energía a mitad de la transacción!', 'err')) : (luis += 100, upd(), add('UPDATE cuentas SET saldo = saldo + 100 WHERE nombre = \'Luis\';')),
        () => fail ? (ana += 100, upd(), add('ROLLBACK;  ← se deshace el cambio', 'err')) : add('COMMIT;', 'good'),
        () => { add(fail ? '✔ <u>Atomicity</u>: el dinero NO desapareció. Ana vuelve a $500.' : '✔ Transacción confirmada: Ana $400 · Luis $300.', 'good'); busy = false; if (fail) { ana = 500; luis = 200; upd(); } },
      ];
      steps.forEach((s, k) => setTimeout(s, 600 * (k + 1)));
    }
    $('#tOk', r).onclick = () => { ana = 500; luis = 200; upd(); run(false); };
    $('#tBad', r).onclick = () => { ana = 500; luis = 200; upd(); run(true); };
  } },

'nosql': { color: C.blue, title: 'Modelo no relacional · <u>NoSQL</u>', sub: '<u>Non-Relational Databases</u>: flexibles y escalables',
  html: sec('¿Qué es?', `<p>Una <u>Non-Relational Database</u> (<u>NoSQL</u>) no obliga a usar tablas. Guarda los datos en el formato que mejor encaja con la aplicación, con un <u>Schema</u> flexible y pensada para crecer con <u>horizontal scaling</u> (agregar más servidores).</p>
    ${pts([['<u>Schema</u> flexible', 'Cada registro puede tener campos distintos.'], ['<u>Horizontal scaling</u>', 'Se reparte la carga en muchos servidores.'], ['<u>BASE</u>', '<u>Basically Available</u>, <u>Soft state</u>, <u>Eventual consistency</u>.'], ['Volumen y velocidad', 'Ideal para <u>Big Data</u>, tiempo real y redes sociales.']])}`)
  + sec('Los 4 tipos, con la misma persona: Ana', `<div id="tabs"><button class="btn on" data-t="doc"><u>Document</u></button><button class="btn" data-t="kv"><u>Key-Value</u></button><button class="btn" data-t="col"><u>Column-family</u></button><button class="btn" data-t="graph"><u>Graph</u></button></div>
    <div class="lab-box" id="tab"></div>`, 'INTERACTIVO'),
  init(r) {
    const tab = $('#tab', r);
    let extra = 0;
    const EXTRAS = [['"telefono"', '"+34 600 123 456"'], ['"hobbies"', '["ajedrez","senderismo"]'], ['"direccion"', '{ "calle": "Gran Vía 1", "cp": 28013 }'], ['"premium"', 'true']];
    const T = {
      doc() {
        const ana = ['"_id": 1', '"nombre": "Ana"', '"ciudad": "Madrid"', ...EXTRAS.slice(0, extra).map(e => e.join(': '))];
        tab.innerHTML = `<p><b>MongoDB</b> · guarda <u>documents</u> tipo JSON. Agrega un campo nuevo <i>sin modificar ninguna tabla</i>:</p>
          <div class="code">{\n  ${ana.join(',\n  ')}\n}</div>
          <button class="btn" id="add" ${extra >= EXTRAS.length ? 'disabled' : ''}>＋ Agregar campo a Ana</button><button class="btn" id="rst">↻ Reiniciar</button>
          <div class="fb ok">${extra ? '✔ ¡Listo! Luis y los demás <u>documents</u> no cambiaron: el <u>Schema</u> es flexible.' : ''}</div>`;
        $('#add', tab).onclick = () => { extra++; T.doc(); }; $('#rst', tab).onclick = () => { extra = 0; T.doc(); };
      },
      kv() {
        const K = [['user:1:name', '"Ana"'], ['user:1:session', '"tok_8f3a9c…"'], ['cart:1', '["Laptop","Mouse"]'], ['visits:home', '15432']];
        tab.innerHTML = `<p><b>Redis</b> · un gran diccionario: <u>key</u> → <u>value</u>. Toca una llave:</p><div>${K.map((k, i) => `<button class="btn" data-i="${i}">${k[0]}</button>`).join('')}</div>
          <div class="code" id="kvo">GET …</div><div class="fb">Solo se busca por <u>key</u>: respuesta en microsegundos, ideal para <u>cache</u> y sesiones.</div>`;
        toggleCls([...tab.querySelectorAll('[data-i]')], b => { const k = K[+b.dataset.i]; $('#kvo', tab).innerHTML = `<span class="k">GET</span> ${k[0]}\n→ <span class="s">${k[1]}</span>   ⚡ 0.2 ms`; });
      },
      col() {
        const R = [['ana', [['nombre', 'Ana'], ['ciudad', 'Madrid'], ['login:23-oct', '08:01'], ['login:24-oct', '09:15']]], ['luis', [['nombre', 'Luis'], ['login:24-oct', '22:40']]]];
        tab.innerHTML = `<p><b>Cassandra</b> · datos agrupados en <u>column families</u>; cada <u>row key</u> puede tener columnas distintas. Toca una fila:</p>
          <table class="db"><tr><th>row key</th><th colspan="4">columns (nombre: valor)</th></tr>${R.map((r, i) => `<tr class="rw" data-i="${i}"><td><b>${r[0]}</b></td>${r[1].map(c => `<td>${c[0]}: <b>${c[1]}</b></td>`).join('')}${'<td class="null"></td>'.repeat(4 - r[1].length)}</tr>`).join('')}</table>
          <div class="fb" id="cfo">Ideal para millones de escrituras: logs, sensores <u>IoT</u>, historiales.</div>`;
        tab.querySelectorAll('tr.rw').forEach(tr => tr.onclick = () => { tab.querySelectorAll('tr.rw').forEach(t => t.classList.remove('hl')); tr.classList.add('hl'); $('#cfo', tab).innerHTML = `<span class="k">SELECT * FROM users WHERE key = '${R[+tr.dataset.i][0]}'</span> → se lee <b>una sola fila</b>, sin <u>JOIN</u>.`; });
      },
      graph() {
        tab.innerHTML = `<p><b>Neo4j</b> · nodos (<u>nodes</u>) y relaciones (<u>edges</u>). Ideal para redes sociales y recomendaciones.</p>
          <div class="chips" id="gr"><span class="gnode" data-n="a">Ana</span><span class="gedge" data-e="1">—FRIEND→</span><span class="gnode" data-n="l">Luis</span><span class="gedge" data-e="2">—FRIEND→</span><span class="gnode" data-n="m">Marta</span><span class="gedge" data-e="3">—LIKES→</span><span class="gnode" data-n="j">Jazz</span></div>
          <button class="btn" data-q="1">¿Amigos de amigos de Ana?</button><button class="btn" data-q="2">¿Qué música le gusta al círculo de Luis?</button>
          <div class="code" id="gq">MATCH … RETURN …</div>`;
        const set = (ns, es) => { tab.querySelectorAll('[data-n]').forEach(x => x.classList.toggle('on', ns.includes(x.dataset.n))); tab.querySelectorAll('[data-e]').forEach(x => x.classList.toggle('on', es.includes(+x.dataset.e))); };
        toggleCls([...tab.querySelectorAll('[data-q]')], b => {
          if (b.dataset.q === '1') { set(['a', 'l', 'm'], [1, 2]); $('#gq', tab).innerHTML = `<span class="k">MATCH</span> (a:Person {name:'Ana'})-[:FRIEND*2]->(x)\n<span class="k">RETURN</span> x;   → <span class="s">Marta</span>`; }
          else { set(['l', 'm', 'j'], [2, 3]); $('#gq', tab).innerHTML = `<span class="k">MATCH</span> (:Person {name:'Luis'})-[:FRIEND]->(f)-[:LIKES]->(g)\n<span class="k">RETURN</span> g;   → <span class="s">Jazz</span>`; }
        });
      },
    };
    T.doc();
    toggleCls([...r.querySelectorAll('#tabs .btn')], b => T[b.dataset.t]());
  } },

'cmp': { color: C.blue, title: 'Comparación · ¿Cuál elegir?', sub: '<u>Relational</u> vs <u>Non-Relational</u>',
  html: sec('Tabla comparativa', `<table class="compare"><tr><th></th><th><u>Relational</u> (<u>SQL</u>)</th><th><u>Non-Relational</u> (<u>NoSQL</u>)</th></tr>
    <tr><td><u>Schema</u></td><td>Fijo, definido de antemano</td><td>Flexible, cambia fácil</td></tr>
    <tr><td>Estructura</td><td><u>Tables</u>, filas y columnas</td><td><u>Documents</u>, <u>key-value</u>, <u>column</u>, <u>graph</u></td></tr>
    <tr><td><u>Scalability</u></td><td>Vertical (servidor más potente)</td><td>Horizontal (más servidores)</td></tr>
    <tr><td>Consistencia</td><td><u>ACID</u>: muy estricta</td><td><u>BASE</u>: eventual</td></tr>
    <tr><td>Relaciones</td><td><u>JOIN</u> entre tablas</td><td>Datos anidados o enlaces</td></tr>
    <tr><td>Ejemplos</td><td>MySQL, PostgreSQL, Oracle</td><td>MongoDB, Redis, Cassandra, Neo4j</td></tr></table>
    <p style="margin-top:14px">💡 <b>Regla práctica:</b> si necesitas <b>exactitud y relaciones</b>, usa <u>Relational</u>; si necesitas <b>flexibilidad y escala masiva</b>, usa <u>Non-Relational</u>. Muchas empresas usan ambas (<u>polyglot persistence</u>).</p>`)
  + sec('Quiz: ¿qué base de datos usarías?', `<div id="qz"></div>`, 'INTERACTIVO'),
  init(r) {
    quiz($('#qz', r), [
      { t: 'Sistema bancario de transferencias entre cuentas', a: 0, why: 'Necesita transacciones <u>ACID</u> y consistencia estricta.' },
      { t: 'Red social con millones de usuarios y relaciones de amistad', a: 1, why: 'Una base tipo <u>Graph</u> recorre relaciones muy rápido y escala horizontalmente.' },
      { t: 'Catálogo de productos donde cada producto tiene atributos distintos', a: 1, why: 'Un <u>Document</u> store permite un <u>Schema</u> flexible.' },
      { t: 'Nómina: empleados, departamentos y puestos ligados entre sí', a: 0, why: 'Datos estructurados con <u>Foreign Keys</u> y <u>JOIN</u>.' },
      { t: 'Caché de sesiones que debe responder en milisegundos', a: 1, why: 'Una <u>Key-Value</u> store como Redis es la más veloz.' },
      { t: 'Inventario con reportes frecuentes que cruzan varias tablas', a: 0, why: '<u>SQL</u> y los <u>JOIN</u> están hechos para eso.' },
    ], ['<u>Relational</u>', '<u>Non-Relational</u>'], 'Elige el modelo más adecuado para cada caso:');
  } },

      { t: '🪟 Windows', a: 0, why: 'Es un <u>Operating System</u>.' }, { t: '📊 Excel', a: 1, why: 'Sirve para una tarea del usuario: hojas de cálculo.' },
      { t: '🐧 Linux', a: 0, why: 'Es un <u>Operating System</u> de código abierto (<u>Open Source</u>).' }, { t: '🌐 Chrome', a: 1, why: 'Es una aplicación para navegar.' },
      { t: '🖨️ Driver de la impresora', a: 0, why: 'Permite al sistema comunicarse con el <u>Hardware</u>.' }, { t: '🎨 Photoshop', a: 1, why: 'Aplicación de edición de imágenes.' },
      { t: '🍎 macOS', a: 0, why: 'Es un <u>Operating System</u>.' }, { t: '💬 WhatsApp', a: 1, why: 'Aplicación de mensajería.' },
    ], ['<u>System software</u>', '<u>Application software</u>'], 'Clasifica el programa:');
  } },

/* ------------------------------------------------------------------ */
'data': { color: C.terra, title: 'Datos · <u>Data</u>', sub: 'De hechos sueltos a conocimiento',
  html: sec('Data → Information → Knowledge', `<p>Los <u>Data</u> son hechos sin contexto. Al procesarlos se vuelven <u>Information</u>, y al interpretarla se obtiene <u>Knowledge</u> para decidir. Pulsa «Procesar» y sube la pirámide:</p>
    <div class="lab-box"><div class="chips" id="pyr"><span class="chipn" data-l="0"><u>Data</u></span><span class="arrow">➜</span><span class="chipn" data-l="1"><u>Information</u></span><span class="arrow">➜</span><span class="chipn" data-l="2"><u>Knowledge</u></span></div>
    <div class="qcard" id="lvl">Datos de un paciente: 37.0 · 38.5 · 40.1</div>
    <button class="btn" id="up">Procesar ▲</button><button class="btn" id="rs">↻ Reiniciar</button></div>`, 'INTERACTIVO')
  + sec('Tipos de datos', pts([['<u>Structured</u>', 'Ordenados en tablas: ventas, inventarios (<u>Relational</u>).'], ['<u>Unstructured</u>', 'Sin formato fijo: fotos, videos, correos, redes sociales (<u>Non-Relational</u>).']]) + `<p>Los datos se guardan en una <u>Database</u>: <button class="link" data-open="t3">Tema 3 ▶</button></p>`),
  init(r) {
    const L = ['Datos de un paciente: 37.0 · 38.5 · 40.1', 'La temperatura subió 3.1 °C en 3 horas.', 'Hay fiebre en aumento: hay que avisar al médico y empezar tratamiento.'];
    let l = 0; const t = $('#lvl', r);
    const paint = () => { t.textContent = L[l]; r.querySelectorAll('[data-l]').forEach(c => c.classList.toggle('on', +c.dataset.l === l)); };
    $('#up', r).onclick = () => { l = Math.min(2, l + 1); paint(); }; $('#rs', r).onclick = () => { l = 0; paint(); }; paint();
  } },

/* ------------------------------------------------------------------ */
'people': { color: C.terra, title: 'Personas · <u>People</u>', sub: 'Quienes usan, construyen y administran el sistema',
  html: sec('Roles principales', pts([['<u>End user</u>', 'Usa el sistema en su trabajo diario.'], ['<u>Developer</u>', 'Programa y mantiene las aplicaciones.'], ['<u>DBA</u>', '<u>Database Administrator</u>: cuida las bases de datos.'], ['<u>Systems Analyst</u>', 'Traduce necesidades del negocio a requisitos.'], ['<u>IT Manager</u>', 'Dirige el equipo, el presupuesto y la estrategia.']]))
  + sec('Juego: ¿quién lo hace?', `<div id="qz"></div>`, 'INTERACTIVO'),
  init(r) {
    quiz($('#qz', r), [
      { t: 'Registra las ventas en la caja de la tienda', a: 0, why: 'Usa el sistema para su trabajo.' },
      { t: 'Programa nuevas funciones de la app', a: 1, why: 'Escribe código.' },
      { t: 'Hace las copias de seguridad de la base de datos', a: 2, why: 'Administra y protege las bases de datos.' },
      { t: 'Entrevista a los clientes y define qué debe hacer el sistema', a: 3, why: 'Conecta el negocio con la tecnología.' },
      { t: 'Decide el presupuesto de tecnología del año', a: 4, why: 'Dirige el área de TI.' },
    ], ['<u>End user</u>', '<u>Developer</u>', '<u>DBA</u>', '<u>Analyst</u>', '<u>IT Manager</u>'], 'Elige el rol:');
  } },

/* ------------------------------------------------------------------ */
'proc': { color: C.terra, title: 'Procesos · <u>Processes</u>', sub: 'Los pasos que organizan el trabajo',
  html: sec('¿Qué son?', `<p>Un <u>Process</u> (o <u>Business Process</u>) es una <b>secuencia ordenada de pasos</b> que convierte entradas en resultados: políticas, procedimientos y flujos de trabajo (<u>workflows</u>). Sin procesos, el <u>Hardware</u>, el <u>Software</u> y las <u>People</u> no saben coordinarse.</p>`)
  + sec('Ordena el proceso de compra en línea', `<p>Toca los pasos <b>en el orden correcto</b>:</p><div class="chips" id="pool"></div>
    <div class="lab-box"><b>Tu orden:</b><div class="chips" id="seq" style="min-height:62px"></div></div><div class="fb" id="of"></div><button class="btn" id="rs">↻ Reiniciar</button>`, 'INTERACTIVO'),
  init(r) {
    const STEPS = ['1 · Elegir el producto', '2 · Pagar', '3 · Validar el pago', '4 · Preparar el envío', '5 · Entregar al cliente'];
    const order = [3, 1, 4, 0, 2];
    let next = 0; const pool = $('#pool', r), seq = $('#seq', r), of = $('#of', r);
    const strip = s => s.replace(/^\d · /, '');
    function paint() {
      pool.innerHTML = order.filter(i => i >= next || false).length ? order.map(i => `<button class="btn" data-i="${i}" ${i < next ? 'style="display:none"' : ''}>${strip(STEPS[i])}</button>`).join('') : '';
      seq.innerHTML = STEPS.slice(0, next).map(s => `<span class="chipn on">${s}</span>`).join('');
      pool.querySelectorAll('.btn').forEach(b => b.onclick = () => {
        if (+b.dataset.i === next) { next++; of.innerHTML = next === 5 ? '<span class="ok">🎉 ¡Proceso completo! Cada paso depende del anterior.</span>' : '<span class="ok">✔ Bien, sigue…</span>'; paint(); }
        else { b.classList.add('shake'); of.innerHTML = '<span class="bad">✘ Ese paso aún no toca. ¿Qué pasa primero?</span>'; setTimeout(() => b.classList.remove('shake'), 400); }
      });
    }
    $('#rs', r).onclick = () => { next = 0; of.innerHTML = ''; paint(); }; paint();
  } },
};

/* map click on hub for third-party keyboard use is handled by the delegated listener above */
